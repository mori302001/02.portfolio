<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisaki</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23bd0000'/></svg>" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400&display=swap" rel="stylesheet">

    <style>
        /* -----------------------------------------
         * 共通・ベーススタイル（シネマティック・ダーク）
         * ----------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0707; 
            color: #a6a092;            
            font-family: "Klee One", "Yu Mincho", "遊明朝", serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景の奥底で怪しく蠢く薄い朱赤のエフェクト */
        .color-stream {
            position: absolute;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 35% 35%, rgba(200, 0, 0, 0.18) 0%, transparent 50%),
                        radial-gradient(circle at 65% 65%, rgba(160, 5, 5, 0.15) 0%, transparent 50%);
            z-index: 1;
            animation: clearZappingWave 20s ease-in-out infinite alternate;
            filter: blur(16px); 
            pointer-events: none;
        }

        @keyframes clearZappingWave {
            0% { transform: translate(0, 0) scale(0.95) rotate(0deg); opacity: 0.3; }      
            50% { transform: translate(-4%, 3%) scale(1.1) rotate(1deg); opacity: 1.0; }    
            100% { transform: translate(3%, -4%) scale(0.9) rotate(-1deg); opacity: 0.4; }   
        }

        /* -----------------------------------------
         * 1. 表紙（COVER PAGE）
         * ----------------------------------------- */
        .cover-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
            z-index: 10;
        }

        /* トップに配置するメイン画像 */
        .hero-photo-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 480px; 
            aspect-ratio: 2 / 3; 
            overflow: hidden;
            border: 1px solid #1c1313; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        .hero-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(105%) brightness(95%);
        }

        /* タイトルエリア（写真の上に重ねる） */
        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; 
            text-align: center;
            width: 100%;
            pointer-events: none; 
        }

        /* 【色変更】朱赤から、品格のある白に近いグレー（#e6e2dc）へ昇華 */
        .cover-title {
            font-family: "Pirata One", serif; 
            font-size: 2.8rem;  
            font-weight: normal;   
            letter-spacing: 0.3em; 
            text-indent: 0.3em;
            user-select: none;
            color: #e6e2dc; /* 白土や印画紙のハイライトを思わせる冷たいグレー */
            
            /* 文字が鋭く、かつ重厚に浮き上がるための立体シャドウ */
            text-shadow: 
                2px 2px 0px rgba(0, 0, 0, 1),
                4px 4px 0px rgba(0, 0, 0, 0.8),
                0px 0px 10px rgba(0, 0, 0, 0.9);
            
            animation: titleBreathing 6s ease-in-out infinite;
        }

        @keyframes titleBreathing {
            0%, 100% { opacity: 0.85; filter: contrast(100%); }
            50% { opacity: 1; filter: contrast(115%); }
        }

        /* 【色変更】矢印も白に近いグレー（#e6e2dc）に統一 */
        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 1.2rem;
            color: #e6e2dc; 
            user-select: none;
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        /* -----------------------------------------
         * 2. WORK（漆黒のギャラリー）
         * ----------------------------------------- */
        .work-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12rem 2rem; 
            position: relative;
            z-index: 20;
        }

        .photo-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 4.5rem; 
        }

        .matrix-item {
            background-color: #0d0d0d; 
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            border: 1px solid #1c1313; 
            cursor: pointer;
            transition: border-color 0.6s, box-shadow 0.6s;
        }

        .matrix-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(70%) contrast(120%) brightness(75%);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (hover: hover) {
            .matrix-item:hover {
                border-color: #b80000;
                box-shadow: 0 0 30px rgba(184, 0, 0, 0.15);
            }
            .matrix-item:hover img {
                filter: grayscale(10%) contrast(105%) brightness(100%);
                transform: scale(1.03); 
            }
        }

        /* -----------------------------------------
         * 3. 全画面表示（ライトボックスモーダル）
         * ----------------------------------------- */
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.99); 
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 1rem; 
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            color: #555;
            font-size: 2.5rem; 
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            z-index: 1001;
        }
        .close-btn:hover {
            color: #b80000;
        }

        /* -----------------------------------------
         * 4. フッター
         * ----------------------------------------- */
        footer {
            padding: 8rem 2rem;
            text-align: center;
            border-top: 1px solid #1c1313;
            background-color: #0b0707;
        }

        .footer-instagram {
            display: inline-block;
            margin-bottom: 2rem;
            color: #66625a;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            transition: color 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .footer-instagram:hover {
            color: #b80000;
            border-bottom-color: #b80000;
        }

        .footer-copyright {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: #3d3636;
        }

        /* -----------------------------------------
         * 5. スマートフォン向けレスポンシブ調整
         * ----------------------------------------- */
        @media (max-width: 768px) {
            .hero-photo-wrapper {
                max-width: 85vw;
            }
            .cover-title {
                font-size: 2.0rem; 
                letter-spacing: 0.2em;
            }
            .work-page {
                padding: 8rem 1.5rem; 
            }
            .photo-matrix {
                gap: 2.5rem; 
            }
        }
    </style>
</head>
<body>

    <section class="cover-page">
        <div class="color-stream"></div>
        
        <div class="hero-photo-wrapper">
            <img src="_EPS3001.jpg" alt="Cover Photo">
        </div>

        <div class="title-container">
            <h1 class="cover-title">Saisaki</h1>
        </div>
        
        <div class="scroll-hint" id="galleryBtn">▼</div>
    </section>

    <main class="work-page" id="gallerySection">
        <div class="photo-matrix" id="photoMatrix"></div>
    </main>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img src="" alt="Fullscreen" class="fullscreen-img" id="fullscreenImg">
    </div>

    <footer>
        <a href="https://www.instagram.com/anko.pho" target="_blank" rel="noopener noreferrer" class="footer-instagram">
            Instagram
        </a>
        <p class="footer-copyright">&copy; 2026 saisaki. All rights reserved.</p>
    </footer>

    <script>
        // 設定：写真を27枚に設定
        const TOTAL_PHOTOS = 27;         
        const IMAGE_PREFIX = "photo";    
        const IMAGE_EXT = ".jpg";        

        // 写真マトリクスの自動生成
        const matrixContainer = document.getElementById('photoMatrix');

        for (let i = 1; i <= TOTAL_PHOTOS; i++) {
            const item = document.createElement('div');
            item.className = 'matrix-item';

            const img = document.createElement('img');
            img.src = `${IMAGE_PREFIX}${i}${IMAGE_EXT}`; 
            img.alt = `Work ${i}`;
            img.loading = 'lazy'; 

            item.appendChild(img);
            matrixContainer.appendChild(item);
        }

        // ▼ ボタンのスクロール処理
        const galleryBtn = document.getElementById('galleryBtn');
        const gallerySection = document.getElementById('gallerySection');

        galleryBtn.addEventListener('click', () => {
            gallerySection.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start'      
            });
        });

        // 全画面表示（モーダル）の制御
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImg = document.getElementById('fullscreenImg');
        const closeBtn = document.getElementById('closeBtn');
        
        matrixContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                fullscreenImg.src = e.target.src;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });

        const closeOverlay = () => {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { fullscreenImg.src = ''; }, 500);
        };

        closeBtn.addEventListener('click', closeOverlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeOverlay();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
        });
    </script>

</body>
</html>
