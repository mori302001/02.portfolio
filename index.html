<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisaki</title>
    
    <!-- タブのファビコン：真っ赤な小さな丸 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23bd0000'/></svg>" type="image/svg+xml">

    <!-- 視認性とソナチネの緊張感を両立した「Pirata One」の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <!-- ギャラリー部分の細い明朝体（クレー One） -->
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400&display=swap" rel="stylesheet">

    <style>
        /* -----------------------------------------
         * 共通・ベーススタイル（シネマティック・ダーク）
         * ----------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0707; 
            color: #a6a092;            
            font-family: "Klee One", "Yu Mincho", "遊明朝", serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 【DL防止】長押しメニューやドラッグをCSSで禁止 */
        img {
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;           
            -webkit-user-drag: none;     
            user-drag: none;
        }

        /* 背景の奥底で怪しく蠢く朱赤のエフェクト */
        .color-stream {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                #000000 10%, 
                rgba(189, 0, 0, 0.22) 45vmax, 
                rgba(189, 0, 0, 0.28) 60vmax, 
                #000000 100%
            );
            z-index: 1;
            animation: delicateZappingWave 6s ease-in-out infinite alternate;
            filter: blur(12px); 
            pointer-events: none;
        }

        @keyframes delicateZappingWave {
            0% { transform: scale(0.95) rotate(0deg); opacity: 0.2; }      
            50% { transform: scale(1.1) translate(-2%, 2%) rotate(2deg); opacity: 1.0; }    
            100% { transform: scale(0.9) translate(2%, -2%) rotate(-1deg); opacity: 0.3; }   
        }

        /* 右上：ABOUTへのナビリンク */
        .nav-link {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            font-family: "Klee One", serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            color: #66625a;
            text-decoration: none;
            padding: 8px 12px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .nav-link:hover {
            color: #e6e2dc;
            text-shadow: 0 0 8px rgba(230, 226, 220, 0.6);
        }

        /* -----------------------------------------
         * 1. 表紙（COVER PAGE）
         * ----------------------------------------- */
        .cover-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2rem;
            z-index: 10;
        }

        /* 表紙のメイン画像 */
        .hero-photo-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 480px; 
            aspect-ratio: 2 / 3; 
            overflow: hidden;
            border: 1px solid #141111; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            animation: cinemaFlickerExtreme 0.08s infinite;
        }

        .hero-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(105%) brightness(95%);
            transition: filter 0.5s ease; 
        }

        /* タイトルエリア */
        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; 
            text-align: center;
            width: 100%;
            pointer-events: none; 
        }

        .cover-title {
            font-family: "Pirata One", serif; 
            font-size: 2.8rem;  
            font-weight: normal;   
            letter-spacing: 0.3em; 
            text-indent: 0.3em;
            user-select: none;
            color: #e6e2dc; 
            text-shadow: 
                2px 2px 0px rgba(0, 0, 0, 1),
                4px 4px 0px rgba(0, 0, 0, 0.8),
                0px 0px 10px rgba(0, 0, 0, 0.9);
            animation: titleBreathing 6s ease-in-out infinite;
        }

        @keyframes titleBreathing {
            0%, 100% { opacity: 0.85; filter: contrast(100%); }
            50% { opacity: 1; filter: contrast(115%); }
        }

        /* スクロールサイン ▼ */
        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 1.2rem;
            color: #e6e2dc; 
            user-select: none;
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        /* -----------------------------------------
         * 2. WORK（漆黒のギャラリー）
         * ----------------------------------------- */
        .work-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12rem 2rem 4rem 2rem; 
            position: relative;
            z-index: 20;
        }

        .photo-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 4.5rem; 
        }

        /* 額縁（フレーム全体） */
        .matrix-item {
            background-color: #e6e2dc; 
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            border: 16px solid #e6e2dc; 
            box-shadow: 8px 8px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            position: relative;
            animation: frameFloat 12s ease-in-out infinite alternate;
        }

        /* 27枚非同期設定 */
        .matrix-item:nth-child(2n)  { animation-duration: 14s; animation-delay: -2s; }
        .matrix-item:nth-child(3n)  { animation-duration: 16s; animation-delay: -5s; }
        .matrix-item:nth-child(5n)  { animation-duration: 11s; animation-delay: -3s; }
        .matrix-item:nth-child(7n)  { animation-duration: 15s; animation-delay: -7s; }

        @keyframes frameFloat {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-2px, 3px) rotate(0.3deg); }
            100% { transform: translate(3px, -2px) rotate(-0.2deg); }
        }

        /* デフォルト：いつもの煤けたオリジナル状態 */
        .matrix-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(70%) contrast(120%) brightness(75%);
            animation: photoDistort 16s ease-in-out infinite alternate, cinemaFlickerExtreme 0.1s infinite;
            transition: filter 0.5s ease; 
        }

        .matrix-item:nth-child(3n) img { animation-duration: 19s, 0.09s; }
        .matrix-item:nth-child(4n) img { animation-duration: 13s, 0.11s; }

        @keyframes photoDistort {
            0% { transform: scale(1.02) skewX(0deg) skewY(0deg); }
            50% { transform: scale(1.05) skewX(0.4deg) skewY(-0.2deg); }
            100% { transform: scale(1.01) skewX(-0.3deg) skewY(0.3deg); }
        }

        @keyframes cinemaFlickerExtreme {
            0%, 100% { filter: grayscale(inherit) contrast(inherit) brightness(100%); }
            10% { filter: grayscale(inherit) contrast(inherit) brightness(60%); }  
            20% { filter: grayscale(inherit) contrast(inherit) brightness(105%); } 
            35% { filter: grayscale(inherit) contrast(inherit) brightness(70%); }
            50% { filter: grayscale(inherit) contrast(inherit) brightness(110%); } 
            65% { filter: grayscale(inherit) contrast(inherit) brightness(65%); }
            80% { filter: grayscale(inherit) contrast(inherit) brightness(95%); }
            90% { filter: grayscale(inherit) contrast(inherit) brightness(55%); }  
        }

        /* -----------------------------------------
         * モノクロモード（ボタンが押されたときの階調縛り）
         * ----------------------------------------- */
        body.mode-monochrome .matrix-item img,
        body.mode-monochrome .hero-photo-wrapper img {
            filter: grayscale(100%) contrast(125%) brightness(70%);
        }

        /* ホバー時の静止処理（モードに応じた質感でピタッと止まる） */
        @media (hover: hover) {
            .matrix-item:hover {
                transform: scale(1.03) !important; 
                animation-play-state: paused;
                box-shadow: 0px 12px 40px rgba(189, 0, 0, 0.3);
                z-index: 30; 
            }
            /* 通常オリジナルのホバー：少し色を残してクリアに */
            .matrix-item:hover img {
                animation-play-state: paused; 
                filter: grayscale(10%) contrast(105%) brightness(100%);
            }
            /* モノクロモード時のホバー：完全な白黒階調としてクリアに */
            body.mode-monochrome .matrix-item:hover img {
                animation-play-state: paused; 
                filter: grayscale(100%) contrast(120%) brightness(95%);
            }
        }

        /* -----------------------------------------
         * 3. CONTROL SIGN（極ミニマルな切り替えボタン）
         * ----------------------------------------- */
        .toggle-container {
            width: 100vw;
            text-align: center;
            padding: 4rem 2rem 8rem 2rem;
            position: relative;
            z-index: 20;
        }

        .dev-toggle-btn {
            background: none;
            border: none;
            font-family: "Klee One", serif;
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            text-indent: 0.4em;
            color: #3d3636; /* 闇に溶けかける暗いグレー */
            cursor: pointer;
            user-select: none;
            padding: 10px 20px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .dev-toggle-btn:hover {
            color: #e6e2dc;
            text-shadow: 0 0 8px rgba(230, 226, 220, 0.6);
        }

        /* -----------------------------------------
         * 4. 全画面表示（ライトボックスモーダル）
         * ----------------------------------------- */
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.99); 
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 2rem; 
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            background-color: #e6e2dc;
            border: 24px solid #e6e2dc; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            transition: filter 0.4s ease; 
        }

        /* モーダル拡大表示時のモノクロ連動 */
        body.mode-monochrome .fullscreen-img {
            filter: grayscale(100%) contrast(115%) brightness(100%);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            color: #555;
            font-size: 2.5rem; 
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            z-index: 1001;
        }
        .close-btn:hover {
            color: #bd0000;
        }

        /* -----------------------------------------
         * 5. フッター
         * ----------------------------------------- */
        footer {
            padding: 8rem 2rem;
            text-align: center;
            border-top: 1px solid #1c1313;
            background-color: #0b0707;
        }

        .footer-instagram {
            display: inline-block;
            margin-bottom: 2rem;
            color: #66625a;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            transition: color 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .footer-instagram:hover {
            color: #bd0000;
            border-bottom-color: #bd0000;
        }

        .footer-copyright {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: #3d3636;
        }

        /* -----------------------------------------
         * 6. スマートフォン向けレスポンシブ調整
         * ----------------------------------------- */
        @media (max-width: 768px) {
            .hero-photo-wrapper {
                max-width: 85vw;
                border: none; 
            }
            .matrix-item {
                border: 10px solid #e6e2dc; 
                animation: frameFloatMobile 10s ease-in-out infinite alternate;
            }
            .fullscreen-img {
                border: 14px solid #e6e2dc;
            }
            .cover-title {
                font-size: 2.0rem; 
                letter-spacing: 0.2em;
            }
            .work-page {
                padding: 8rem 1.5rem 2rem 1.5rem; 
            }
            .toggle-container {
                padding: 2rem 2rem 6rem 2rem;
            }
            .photo-matrix {
                gap: 2.5rem; 
            }
        }

        @keyframes frameFloatMobile {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-1px, 2px); }
        }
    </style>
</head>
<body>

    <!-- 背景の奥底で怪しく蠢く朱赤のエフェクト -->
    <div class="color-stream"></div>

    <a href="about.html" class="nav-link">ABOUT</a>

    <!-- 1. 表紙（COVER PAGE） -->
    <section class="cover-page">
        <div class="hero-photo-wrapper">
            <img src="_EPS3001.jpg" alt="Cover Photo">
        </div>

        <div class="title-container">
            <h1 class="cover-title">Saisaki</h1>
        </div>
        
        <div class="scroll-hint" id="galleryBtn">▼</div>
    </section>

    <!-- 2. WORK（GALLERY MATRIX：27枚） -->
    <main class="work-page" id="gallerySection">
        <div class="photo-matrix" id="photoMatrix"></div>
    </main>

    <!-- 3. CONTROL SIGN（修正：極ミニマルな2状態トグルボタン） -->
    <section class="toggle-container">
        <button class="dev-toggle-btn" id="devToggleBtn">MONOCHROME</button>
    </section>

    <!-- 4. 全画面表示用オーバーレイ -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img src="" alt="Fullscreen" class="fullscreen-img" id="fullscreenImg">
    </div>

    <!-- 5. フッター -->
    <footer>
        <a href="https://www.instagram.com/anko.pho" target="_blank" rel="noopener noreferrer" class="footer-instagram">
            Instagram
        </a>
        <p class="footer-copyright">&copy; 2026 saisaki. All rights reserved.</p>
    </footer>

    <!-- -----------------------------------------
     * JavaScript: 動的画像生成 & シンプル2トグル制御
     * ----------------------------------------- -->
    <script>
        // 設定：写真は27枚に設定
        const TOTAL_PHOTOS = 27;         
        const IMAGE_PREFIX = "photo";    
        const IMAGE_EXT = ".jpg";        

        // 写真マトリクスの自動生成
        const matrixContainer = document.getElementById('photoMatrix');

        for (let i = 1; i <= TOTAL_PHOTOS; i++) {
            const item = document.createElement('div');
            item.className = 'matrix-item';

            // 各要素のランダムなディレイ設定
            const randomDelay = (Math.random() * -10).toFixed(2);
            item.style.animationDelay = `${randomDelay}s`;

            const img = document.createElement('img');
            img.src = `${IMAGE_PREFIX}${i}${IMAGE_EXT}`; 
            img.alt = `Work ${i}`;
            img.loading = 'lazy'; 

            // 中の写真のディレイ設定
            const randomImgDelay = (Math.random() * -15).toFixed(2);
            img.style.animationDelay = `${randomImgDelay}s, ${randomImgDelay}s`;

            item.appendChild(img);
            matrixContainer.appendChild(item);
        }

        // ▼ ボタンのスクロール処理
        const galleryBtn = document.getElementById('galleryBtn');
        const gallerySection = document.getElementById('gallerySection');

        galleryBtn.addEventListener('click', () => {
            gallerySection.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start'      
            });
        });

        // 全画面表示（モーダル）の制御
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImg = document.getElementById('fullscreenImg');
        const closeBtn = document.getElementById('closeBtn');
        
        matrixContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                fullscreenImg.src = e.target.src;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });

        const closeOverlay = () => {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { fullscreenImg.src = ''; }, 500);
        };

        closeBtn.addEventListener('click', closeOverlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeOverlay();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
        });

        // ==========================================
        // 【修正】シンプルに2つの単語が行き来するトグルロジック
        // ==========================================
        const devToggleBtn = document.getElementById('devToggleBtn');

        devToggleBtn.addEventListener('click', () => {
            // bodyのクラスをトグル（ON/OFF切り替え）
            const isMono = document.body.classList.toggle('mode-monochrome');
            
            // クラスの状態に応じて、次に切り替わるための単語を提示
            if (isMono) {
                devToggleBtn.textContent = 'ORIGINAL';
            } else {
                devToggleBtn.textContent = 'MONOCHROME';
            }
        });

        // JavaScriptによる右クリック・保存防止プロテクト
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG' || e.target.closest('.matrix-item') || e.target.id === 'fullscreenImg') {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
