<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* -----------------------------------------
         * 共通・ベーススタイル（和の静寂）
         * ----------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f2f0eb; /* 漆喰や白土壁のような、温かみと陰影のあるマットな生成り色 */
            color: #3a3935;            /* 炭のような深い墨色 */
            font-family: "Klee One", "Yu Mincho", "遊明朝", serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* -----------------------------------------
         * 1. 表紙（COVER PAGE）
         * ----------------------------------------- */
        .cover-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #e6e2da; /* 波の階調を引き立たせるため、ベースを僅かに深く */
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 漆喰壁のマットな微細ノイズテクスチャ */
        .matrix-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 0);
            background-size: 3px 3px, 4px 4px; 
            background-position: 0 0, 1px 1px;
            opacity: 0.9;
            z-index: 2; 
            mix-blend-mode: multiply; 
            pointer-events: none;
        }

        /* 【強調修正】漆喰壁の奥で、光と影がダイナミックに移ろう陰翳レイヤー */
        .color-stream {
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            /* コントラストを強め、薄墨の影（暗部）と日差し（明部）のメリハリを強調 */
            background: linear-gradient(to left, 
                rgba(206, 198, 183, 0.7), /* しっかりとした土壁の影 */
                rgba(185, 195, 178, 0.5), /* 畳の深い翳り */
                rgba(245, 242, 235, 0.9), /* 強く差し込む逆光・障子の白 */
                rgba(170, 176, 180, 0.6), /* 濃い薄墨・夕暮れの深い影 */
                rgba(206, 198, 183, 0.7)  
            );
            background-size: 50% 100%;
            z-index: 1;
            /* ease-in-out に変更し、波が寄せては返すような有機的な緩急をつける */
            animation: streamMoveRightToLeft 16s ease-in-out infinite; 
        }

        @keyframes streamMoveRightToLeft {
            0% { transform: translateX(0%); }
            50% { transform: translateX(-25%); } /* 途中で少し溜まりを作るような動き */
            100% { transform: translateX(-50%); } 
        }

        /* タイトルエリア */
        .title-container {
            position: relative;
            z-index: 3; 
            text-align: center;
        }

        /* フォントサイズを小さくし、太く重量感を持たせた「SAISAKI」 */
        .cover-title {
            font-family: "Klee One", serif; 
            font-size: 3.8rem;  
            font-weight: 600;   
            letter-spacing: 0.5em; 
            text-indent: 0.5em;
            user-select: none;
            display: inline-block;
            color: #9c9687; /* 波の強調に合わせて、文字のベース影も僅かに深く */
            
            text-shadow: 1px 1px 2px rgba(242, 240, 235, 0.6);
        }

        /* 移ろう光のように、左から右へゆっくりと影が晴れる仕掛け */
        .cover-title span {
            display: inline-block;
            animation: waveLightShadow 5s infinite ease-in-out;
        }

        .cover-title span:nth-child(1) { animation-delay: 0.0s; } 
        .cover-title span:nth-child(2) { animation-delay: 0.2s; } 
        .cover-title span:nth-child(3) { animation-delay: 0.4s; } 
        .cover-title span:nth-child(4) { animation-delay: 0.6s; } 
        .cover-title span:nth-child(5) { animation-delay: 0.8s; } 
        .cover-title span:nth-child(6) { animation-delay: 1.0s; } 
        .cover-title span:nth-child(7) { animation-delay: 1.2s; } 

        @keyframes waveLightShadow {
            0%, 60%, 100% {
                color: #9c9687; 
            }
            25% {
                color: #2e2d2a; 
            }
        }

        /* 洗練されたスクロールヒント */
        .scroll-hint {
            position: absolute;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 1.2rem;
            color: #7a7467; 
            user-select: none;
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -8px); }
            60% { transform: translate(-50%, -4px); }
        }

        /* -----------------------------------------
         * 2. WORK（ギャラリーページ）
         * ----------------------------------------- */
        .work-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12rem 2rem; 
        }

        .photo-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 4.5rem; 
        }

        .matrix-item {
            background-color: #e8e5de; 
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            border: 1px solid #e3ded5;
            cursor: pointer;
            transition: border-color 0.6s;
        }

        .matrix-item:hover {
            border-color: #8c867a;
        }

        .matrix-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%) contrast(95%) brightness(98%);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (hover: hover) {
            .matrix-item:hover img {
                filter: grayscale(0%) contrast(100%) brightness(100%);
                transform: scale(1.02); 
            }
        }

        /* -----------------------------------------
         * 3. 全画面表示（ライトボックスモーダル）
         * ----------------------------------------- */
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(10, 10, 10, 0.98); 
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 1rem; 
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            transform: scale(0.97);
            transition: transform 0.5s ease;
        }

        .fullscreen-overlay.active .fullscreen-img {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            color: #666;
            font-size: 2.5rem; 
            cursor: pointer;
            transition: color 0.3s;
            user-select: none;
            z-index: 1001;
        }
        .close-btn:hover {
            color: #ddd;
        }

        /* -----------------------------------------
         * 4. フッター
         * ----------------------------------------- */
        footer {
            padding: 7rem 2rem;
            text-align: center;
            border-top: 1px solid #e3ded5;
        }

        .footer-instagram {
            display: inline-block;
            margin-bottom: 2rem;
            color: #7a756c;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            transition: color 0.3s, border-color 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .footer-instagram:hover {
            color: #2e2d2a;
            border-bottom-color: #2e2d2a;
        }

        .footer-copyright {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: #a6a092;
        }

        /* -----------------------------------------
         * 5. スマートフォン向けレスポンシブ調整
         * ----------------------------------------- */
        @media (max-width: 768px) {
            .cover-title {
                font-size: 2.2rem; 
                letter-spacing: 0.3em;
                text-indent: 0.3em;
            }
            
            .work-page {
                padding: 8rem 1.5rem; 
            }
            
            .photo-matrix {
                gap: 2.5rem; 
            }
        }
    </style>
</head>
<body>

    <section class="cover-page">
        <div class="matrix-bg"></div>
        <div class="color-stream"></div>
        
        <div class="title-container">
            <h1 class="cover-title">
                <span>S</span><span>A</span><span>I</span><span>S</span><span>A</span><span>K</span><span>I</span>
            </h1>
        </div>
        
        <div class="scroll-hint">▼</div>
    </section>

    <main class="work-page">
        <div class="photo-matrix" id="photoMatrix"></div>
    </main>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img src="" alt="Fullscreen" class="fullscreen-img" id="fullscreenImg">
    </div>

    <footer>
        <a href="https://www.instagram.com/anko.pho" target="_blank" rel="noopener noreferrer" class="footer-instagram">
            Instagram
        </a>
        <p class="footer-copyright">&copy; 2026 saisaki. All rights reserved.</p>
    </footer>

    <script>
        // ==========================================
        // 設定：あなたの写真の設定
        // ==========================================
        const TOTAL_PHOTOS = 18;         
        const IMAGE_PREFIX = "photo";    
        const IMAGE_EXT = ".jpg";        

        // ==========================================
        // 写真マトリクスの自動生成
        // ==========================================
        const matrixContainer = document.getElementById('photoMatrix');

        for (let i = 1; i <= TOTAL_PHOTOS; i++) {
            const item = document.createElement('div');
            item.className = 'matrix-item';

            const img = document.createElement('img');
            img.src = `${IMAGE_PREFIX}${i}${IMAGE_EXT}`; 
            img.alt = `Work ${i}`;
            img.loading = 'lazy'; 

            item.appendChild(img);
            matrixContainer.appendChild(item);
        }

        // ==========================================
        // 全画面表示（モーダル）の制御
        // ==========================================
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImg = document.getElementById('fullscreenImg');
        const closeBtn = document.getElementById('closeBtn');
        
        matrixContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                fullscreenImg.src = e.target.src;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });

        const closeOverlay = () => {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { fullscreenImg.src = ''; }, 500);
        };

        closeBtn.addEventListener('click', closeOverlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeOverlay();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
        });
    </script>

</body>
</html>
